<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoShare AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5fa;
      text-align: center;
      padding: 30px 15px;
      color: #222;
    }
    main {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
    }
    button, input {
      margin: 10px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      background: #315bea;
      color: white;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    img {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }
    #status, #link { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>📸 PhotoShare AI</h1>
  <p>Загрузи фотографию и отправь её в ChatGPT.</p>

  <input type="file" id="photo" accept="image/*">
  <br>
  <button id="upload">Загрузить фотографию</button>
  <br>
  <button id="share" hidden>Отправить фото в ChatGPT</button>
  <p id="status"></p>
  <img id="preview" hidden>
  <p id="link"></p>
</main>

<script>
const SUPABASE_URL = "https://kgynqisvnioddlwzxzpm.supabase.co";
const SUPABASE_KEY = "sb_publishable_KPb7HGJnAIahzE8j5Jp0XA_MgMH5BW8";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentFile = null;

const photoInput = document.getElementById("photo");
const uploadButton = document.getElementById("upload");
const shareButton = document.getElementById("share");
const status = document.getElementById("status");
const link = document.getElementById("link");
const preview = document.getElementById("preview");

uploadButton.addEventListener("click", async () => {
  const file = photoInput.files[0];
  link.innerHTML = "";
  shareButton.hidden = true;
  preview.hidden = true;

  if (!file) {
    status.textContent = "Сначала выбери фотографию.";
    return;
  }

  if (!file.type.startsWith("image/") || file.size > 10 * 1024 * 1024) {
    status.textContent = "Выбери изображение размером до 10 МБ.";
    return;
  }

  uploadButton.disabled = true;
  status.textContent = "Загружаю фотографию...";

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = crypto.randomUUID() + "-" + safeName;

    const { error } = await client.storage.from("photos").upload(path, file, {
      contentType: file.type,
      upsert: false
    });

    if (error) throw error;

    const { data, error: urlError } = await client.functions.invoke(
      "index-ts",
      { body: { path } }
    );

    if (urlError || !data?.url) {
      throw new Error(urlError?.message || "Не удалось создать ссылку");
    }

    currentFile = file;
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    shareButton.hidden = false;

    status.textContent = "Готово! Ссылка действует 1 час.";

    const a = document.createElement("a");
    a.href = data.url;
    a.textContent = "Открыть фотографию";
    a.target = "_blank";
    a.rel = "noopener";
    link.appendChild(a);

    const copy = document.createElement("button");
    copy.textContent = "Скопировать ссылку";
    copy.onclick = async () => {
      await navigator.clipboard.writeText(data.url);
      copy.textContent = "Скопировано!";
    };

    link.appendChild(document.createElement("br"));
    link.appendChild(copy);

  } catch (error) {
    status.textContent = "Ошибка: " + error.message;
  } finally {
    uploadButton.disabled = false;
  }
});

shareButton.addEventListener("click", async () => {
  if (!currentFile) return;

  const file = new File(
    [currentFile],
    currentFile.name,
    { type: currentFile.type }
  );

  try {
    if (navigator.share && navigator.canShare &&
        navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: "Фотография для ChatGPT"
      });
      status.textContent = "Открылось меню отправки фотографии.";
    } else {
      const url = URL.createObjectURL(file);
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(url);
      status.textContent = "Фото скачано. Теперь прикрепи его к чату ChatGPT.";
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      status.textContent = "Не удалось отправить фото: " + error.message;
    }
  }
});
</script>
</body>
</html>
